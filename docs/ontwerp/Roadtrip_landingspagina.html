<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moral Maps Roadtrip</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#14203A;color:#FBF3E6}
.hero{position:relative;min-height:100vh;overflow:hidden}
.land,.land img{position:absolute;inset:0;width:100%;height:100%}.land img{object-fit:cover;object-position:50% 70%}
.shade{position:absolute;inset:0;background:linear-gradient(100deg,rgba(9,15,30,.62) 0%,rgba(9,15,30,.25) 45%,rgba(9,15,30,0) 65%)}
.copy{position:relative;z-index:2;padding:15vh 0 0 8vw;max-width:640px}
.eyebrow{font-size:15px;letter-spacing:6px;text-transform:uppercase;font-weight:700;color:#F2C27E;margin-bottom:6px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(72px,11vw,148px);line-height:.92;letter-spacing:-2px;color:#FBF3E6}
h1 em{font-style:italic;color:#F2C27E}
.sub{font-size:clamp(18px,1.8vw,24px);line-height:1.45;color:#E9DCC4;margin:22px 0 36px;max-width:440px}
.start{display:inline-flex;align-items:center;gap:12px;height:60px;padding:0 30px;border-radius:999px;background:#B8471F;color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.start:hover{background:#9E3B17}
.phone{position:absolute;z-index:2;right:9vw;top:11vh;width:300px;height:620px;border-radius:46px;background:#141B2A;padding:12px;box-shadow:0 50px 90px rgba(0,0,0,.55),inset 0 0 0 2px #2D3A52;transform:rotate(4deg)}
.notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:999px;background:#0B0F18;z-index:3}
.screen{height:100%;border-radius:36px;overflow:hidden;background:#F3E6CF;color:#2A2118;display:flex;flex-direction:column}
.scr-head{display:flex;justify-content:space-between;align-items:baseline;padding:52px 18px 8px}
.scr-title{font-family:'DM Serif Display',Georgia,serif;font-size:24px}
.scr-meta{font-size:11px;font-weight:700;color:#6B5A48}
.scr-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 18px 6px}
.scr-bar i{height:5px;border-radius:3px;background:#E2D3BC}
.scr-card{margin:auto 12px 14px;background:#FFFAF1;border:1px solid #E2D3BC;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.scr-card span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#6B5A48}
.scr-card b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:18px}
.scr-card i{font-style:normal;align-self:flex-start;margin-top:4px;background:#2A2118;color:#FBF3E6;font-size:12px;font-weight:700;border-radius:999px;padding:7px 14px}
@media (max-width:900px){
  .land img{object-position:42% 50%}
  .shade{background:linear-gradient(180deg,rgba(9,15,30,.55) 0%,rgba(9,15,30,.15) 45%,rgba(9,15,30,0) 60%)}
  .phone{display:none}
  .copy{padding:12vh 28px 0;text-align:center;margin:0 auto}
  .sub{margin-left:auto;margin-right:auto}
}
</style></head><body><main class="hero">
  <picture class="land">
    <source media="(max-width:900px)" srcset="roadtrip-hero-mobiel.jpg">
    <img src="roadtrip-hero-desktop.jpg" alt="Een slingerende weg met cipressen door heuvels bij dageraad, een auto met brandende achterlichten rijdt richting de bergen">
  </picture>
  <div class="shade" aria-hidden="true"></div>

  <div class="copy">
    <p class="eyebrow">Moral Maps</p>
    <h1>Road<em>trip</em></h1>
    <p class="sub">Waar sta jij voor, en waar wil je heen?</p>
    <a class="start" href="#">Start je roadtrip
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div class="phone" aria-hidden="true">
    <div class="notch"></div>
    <div class="screen">
      <div class="scr-head"><span class="scr-title">Jouw kaart</span><span class="scr-meta">Dag 1 · 06:12</span></div>
      <div class="scr-bar"><i style="background:#3D4568"></i><i style="background:#E39A5B"></i><i></i><i></i><i></i></div>
      <svg viewBox="0 0 390 440" width="100%" style="display:block">
        <path d="M0 100 L 150 120 C 178 170, 166 220, 176 266 L 62 272 C 42 274, 30 284, 24 300 L 20 440 L 0 440 Z" fill="#BFD3D6"/>
        <line x1="130" y1="0" x2="130" y2="440" stroke="#E6D6BB"/><line x1="260" y1="0" x2="260" y2="440" stroke="#E6D6BB"/><line x1="0" y1="220" x2="390" y2="220" stroke="#E6D6BB"/>
        <path d="M176 284 l 8 -12 l 8 12 M 192 282 l 10 -16 l 10 16 M 212 284 l 8 -12 l 8 12" fill="none" stroke="#7A6A55" stroke-width="1.6"/>
        <path d="M300 40 C 296 80, 286 110, 284 140" fill="none" stroke="#B8471F" stroke-width="5" stroke-linecap="round"/>
        <path d="M284 140 C 280 180, 266 200, 262 230 C 246 262, 220 290, 196 302 S 150 340, 130 356 S 96 330, 80 324 S 48 318, 36 316" fill="none" stroke="#B8471F" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
        <circle cx="300" cy="40" r="7" fill="#2A2118"/><text x="314" y="45" font-family="DM Sans" font-size="14" font-weight="700" fill="#2A2118">Tilburg</text>
        <circle cx="284" cy="140" r="11" fill="none" stroke="#B8471F" stroke-width="2" opacity=".5"/><circle cx="284" cy="140" r="6" fill="#B8471F"/>
        <circle cx="36" cy="316" r="7" fill="#F3E6CF" stroke="#1E4E79" stroke-width="3"/>
        <text x="26" y="350" font-family="DM Serif Display" font-size="17" fill="#1E4E79">Finisterre</text>
        <path d="M318 196 l 11 -20 l 11 20 Z" fill="#6E5A6B"/><path d="M330 228 l 10 -17 l 10 17 Z" fill="#6E5A6B"/><path d="M314 258 l 9 -15 l 9 15 Z" fill="#6E5A6B"/>
        <g transform="translate(70 58) rotate(-8)"><circle r="28" fill="none" stroke="#1E4E79" stroke-width="1.8"/><circle r="22" fill="none" stroke="#1E4E79"/><text y="4" text-anchor="middle" font-family="DM Sans" font-size="10" font-weight="700" fill="#1E4E79" letter-spacing="1">VERTREK</text></g>
      </svg>
      <div class="scr-card"><span>Halte 1 · Thuis</span><b>De tas staat al klaar.</b><i>Instappen</i></div>
    </div>
  </div>
</main>
</body></html>
